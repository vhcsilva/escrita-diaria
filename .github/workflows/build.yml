name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: ./gradlew assembleRelease --stacktrace
      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk EscritaDiaria-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EscritaDiaria-apk
          path: EscritaDiaria-*.apk
      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" EscritaDiaria-${{ github.run_number }}.apk \
            --title "Escrita Diária (build ${{ github.run_number }})" \
            --notes "APK para instalar no tablet. Gerado do commit ${{ github.sha }}."
